services:
  dsh:
    image: pkgship/deepseek-harness:latest
    container_name: dsh
    ports:
      - "3080:3080"
    environment:
      # Address the browser uses. Change it when accessing from another machine,
      # e.g. http://192.168.1.50:3080/ — its authority is trusted automatically.
      DSH_PUBLIC_URL: http://localhost:3080/
      # Extra accepted authorities, comma or space separated.
      # DSH_TRUSTED_HOSTS: dsh.lan,192.168.1.50
    volumes:
      - dsh-home:/home/node/.dsh
      - dsh-workspace:/workspace
      # Host directories work too; the entrypoint gives them to UID 1000 by itself.
      # - ./data/dsh-home:/home/node/.dsh
      # - ./data/workspace:/workspace
    restart: unless-stopped

volumes:
  dsh-home:
  dsh-workspace:
